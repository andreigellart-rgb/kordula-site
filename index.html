<style>
  :root { --ink:#111; --muted:#6b6b6b; --accent:#e10600; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#fff; }
  body {
    color:var(--ink); font-family:"Helvetica Neue", Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:32px 24px 64px; text-align:center;
  }
  main { max-width:560px; }
  .badge {
    position:relative; width:min(300px,70vw); aspect-ratio:1; margin:0 auto 40px;
    border-radius:50%; overflow:hidden; isolation:isolate;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.28), 0 4px 10px rgba(0,0,0,.08);
    animation: float 6s ease-in-out infinite;
  }
  .badge img { width:100%; height:100%; display:block; }
  /* gloss: static top highlight */
  .badge::before {
    content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; z-index:2;
    background: radial-gradient(120% 70% at 30% 8%, rgba(255,255,255,.75) 0%, rgba(255,255,255,.18) 38%, rgba(255,255,255,0) 55%);
    mix-blend-mode: screen;
  }
  /* shimmer: moving light sweep */
  .badge::after {
    content:""; position:absolute; top:-50%; left:-60%; width:45%; height:200%; z-index:3; pointer-events:none;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.65) 50%, rgba(255,255,255,0) 100%);
    transform: rotate(25deg);
    animation: sweep 4.5s ease-in-out infinite;
  }
  /* iridescent tint */
  .badge .iri {
    position:absolute; inset:0; border-radius:50%; z-index:1; pointer-events:none;
    background: conic-gradient(from 0deg, #ff9ad5, #9ad0ff, #b7ffcf, #fff3a0, #ff9ad5);
    mix-blend-mode: soft-light; opacity:.35;
    animation: spin 12s linear infinite;
  }
  @keyframes sweep { 0% { left:-60%; } 55%,100% { left:130%; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .badge, .badge::after, .badge .iri { animation:none; } .badge::after { display:none; } }
  h1 { font-size:22px; font-weight:600; letter-spacing:.02em; }
  .en { color:var(--muted); font-size:16px; margin-top:8px; }
  .line { width:44px; height:3px; background:var(--accent); margin:28px auto; border-radius:2px; }
  .contact { font-size:18px; }
  .contact a { color:var(--ink); text-decoration:none; border-bottom:2px solid var(--accent); padding-bottom:2px; }
  .contact a:hover { color:var(--accent); }
  footer { position:fixed; bottom:18px; left:0; right:0; font-size:13px; color:var(--muted); }
</style>
